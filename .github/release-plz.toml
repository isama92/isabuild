[workspace]
# Cut a git tag and a GitHub release for every version bump; the release event
# is what triggers the cross-platform installer build in release.yml.
git_release_enable = true
git_tag_enable = true
# Match the v-prefixed tag scheme release.yml reads for its asset names.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Maintain CHANGELOG.md from Conventional Commit messages.
changelog_update = true
# This is a desktop application, not a crate: do not publish to crates.io.
# Deliberately NOT set in src-tauri/Cargo.toml — a `publish = false` there marks
# the package non-publishable, which makes release-plz skip creating the git tag
# and GitHub release entirely (its release step only tags publishable crates).
# Keep the manifest publishable so release-plz can tag; this line blocks the
# actual publish.
publish = false
# Skip cargo-semver-checks. It is on by default for anything with a [lib]
# target, and src-tauri/Cargo.toml has one — but only as the Windows bin/lib
# name-collision workaround, not as a public API anyone depends on. Running it
# would mean compiling the crate here, which needs the webkit/gtk dev headers
# and a built ../dist for generate_context!(), neither of which this job sets up.
semver_check = false
# Determine the last released version from git tags, not the cargo registry.
# Since this crate is never published to crates.io, the registry has no entry,
# so without this release-plz finds no baseline and never opens a release PR
# (it just logs "nothing to release"). With git_only it reads the `v{version}`
# tag and bumps from the commits since then.
git_only = true

[[package]]
name = "isabuild"
# Keep the changelog at the repo root, where it is discoverable, instead of the
# default "next to the package's Cargo.toml" — which here would bury it in
# src-tauri/. The path is relative to the root manifest (src-tauri/Cargo.toml,
# via the workflow's manifest_path), hence the "..". changelog_path is only
# valid in a [[package]] section, never in [workspace].
changelog_path = "../CHANGELOG.md"
